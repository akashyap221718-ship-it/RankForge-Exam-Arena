openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Learner dashboard operations
  - name: practice
    description: Practice and question-set operations
  - name: contests
    description: Competitive contest operations
  - name: leaderboard
    description: Ranking operations
  - name: profile
    description: Authenticated learner profile operations
  - name: jobs
    description: Legitimate job listing operations
  - name: engineering
    description: Engineering study material operations
  - name: interview
    description: Interview preparation operations
  - name: coding
    description: Coding practice operations
  - name: feedback
    description: Feedback and complaint operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get learner dashboard
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /tracks:
    get:
      operationId: listTracks
      tags: [practice]
      summary: List exam tracks
      responses:
        "200":
          description: Available exam tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
  /question-sets:
    get:
      operationId: listQuestionSets
      tags: [practice]
      summary: List recommended question sets
      parameters:
        - name: track
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Question sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSet"
  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [practice]
      summary: Get a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "404":
          description: Question not found
  /attempts:
    post:
      operationId: submitAttempt
      tags: [practice]
      summary: Submit an answer attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "201":
          description: Attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
  /contests:
    get:
      operationId: listContests
      tags: [contests]
      summary: List upcoming contests
      responses:
        "200":
          description: Contests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contest"
  /contests/{id}/join:
    post:
      operationId: joinContest
      tags: [contests]
      summary: Join a contest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined contest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get global leaderboard
      responses:
        "200":
          description: Leaderboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the authenticated learner profile
      responses:
        "200":
          description: Learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List verified job listings
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: workType
          in: query
          required: false
          schema: { type: string }
        - name: location
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Verified job listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /engineering/materials:
    get:
      operationId: listEngineeringMaterials
      tags: [engineering]
      summary: List engineering study materials
      parameters:
        - name: branch
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Study materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EngineeringMaterial" }
  /interview/roles:
    get:
      operationId: listInterviewRoles
      tags: [interview]
      summary: List interview preparation roles
      responses:
        "200":
          description: Interview roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InterviewRole" }
  /interview/questions:
    get:
      operationId: listInterviewQuestions
      tags: [interview]
      summary: List interview questions
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Interview questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InterviewQuestion" }
  /coding/problems:
    get:
      operationId: listCodingProblems
      tags: [coding]
      summary: List coding practice problems
      parameters:
        - name: difficulty
          in: query
          required: false
          schema: { type: string }
        - name: topic
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Coding problems
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CodingProblem" }
  /coding/submissions:
    post:
      operationId: submitCodingSolution
      tags: [coding]
      summary: Store a coding solution for secure evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodingSubmissionInput"
      responses:
        "201":
          description: Submission accepted for evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodingSubmissionResult"
  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit feedback or a complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        stats:
          $ref: "#/components/schemas/DashboardStats"
        focus:
          type: array
          items:
            $ref: "#/components/schemas/FocusTopic"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required: [user, stats, focus, recentActivity]
    UserProfile:
      type: object
      properties:
        name: { type: string }
        initials: { type: string }
        target: { type: string }
        streak: { type: integer }
        rank: { type: integer }
        percentile: { type: number }
      required: [name, initials, target, streak, rank, percentile]
    DashboardStats:
      type: object
      properties:
        solved: { type: integer }
        accuracy: { type: number }
        rating: { type: integer }
        hours: { type: number }
        solvedDelta: { type: integer }
        accuracyDelta: { type: number }
        ratingDelta: { type: integer }
        hoursDelta: { type: number }
      required: [solved, accuracy, rating, hours, solvedDelta, accuracyDelta, ratingDelta, hoursDelta]
    FocusTopic:
      type: object
      properties:
        name: { type: string }
        subtitle: { type: string }
        progress: { type: integer }
        color: { type: string }
      required: [name, subtitle, progress, color]
    Activity:
      type: object
      properties:
        title: { type: string }
        meta: { type: string }
        points: { type: integer }
        kind: { type: string }
      required: [title, meta, points, kind]
    Track:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        shortName: { type: string }
        description: { type: string }
        questionCount: { type: integer }
        color: { type: string }
      required: [id, name, shortName, description, questionCount, color]
    QuestionSet:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        subtitle: { type: string }
        track: { type: string }
        difficulty: { type: string }
        questions: { type: integer }
        duration: { type: integer }
        completion: { type: integer }
        accent: { type: string }
      required: [id, title, subtitle, track, difficulty, questions, duration, completion, accent]
    Question:
      type: object
      properties:
        id: { type: integer }
        setId: { type: integer }
        title: { type: string }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: integer }
        explanation: { type: string }
        topic: { type: string }
        difficulty: { type: string }
      required: [id, setId, title, prompt, options, answer, explanation, topic, difficulty]
    AttemptInput:
      type: object
      properties:
        questionId: { type: integer }
        selectedOption: { type: integer }
        secondsSpent: { type: integer }
      required: [questionId, selectedOption, secondsSpent]
    AttemptResult:
      type: object
      properties:
        correct: { type: boolean }
        points: { type: integer }
        explanation: { type: string }
        newRating: { type: integer }
      required: [correct, points, explanation, newRating]
    Contest:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        subtitle: { type: string }
        startsAt: { type: string }
        duration: { type: integer }
        participants: { type: integer }
        status: { type: string }
        accent: { type: string }
      required: [id, title, subtitle, startsAt, duration, participants, status, accent]
    Leaderboard:
      type: object
      properties:
        userRank: { type: integer }
        totalUsers: { type: integer }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [userRank, totalUsers, entries]
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        name: { type: string }
        initials: { type: string }
        target: { type: string }
        rating: { type: integer }
        solved: { type: integer }
        isCurrentUser: { type: boolean }
      required: [rank, name, initials, target, rating, solved, isCurrentUser]
    Profile:
      type: object
      properties:
        fullName: { type: string }
        username: { type: string }
        email: { type: string }
        avatarUrl: { type: ["string", "null"] }
        phoneNumber: { type: ["string", "null"] }
        college: { type: ["string", "null"] }
        course: { type: ["string", "null"] }
        branch: { type: ["string", "null"] }
        year: { type: ["string", "null"] }
        graduationYear: { type: ["integer", "null"] }
        skills:
          type: array
          items: { type: string }
        programmingLanguages:
          type: array
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        careerGoal: { type: ["string", "null"] }
        preferredJobRole: { type: ["string", "null"] }
        learningGoals: { type: ["string", "null"] }
        skillLevel: { type: ["string", "null"] }
        targetCompanies:
          type: array
          items: { type: string }
        profileCompletion: { type: integer }
      required: [fullName, username, email, avatarUrl, phoneNumber, college, course, branch, year, graduationYear, skills, programmingLanguages, interests, careerGoal, preferredJobRole, learningGoals, skillLevel, targetCompanies, profileCompletion]
    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string, maxLength: 120 }
        username: { type: string, maxLength: 60 }
        phoneNumber: { type: ["string", "null"], maxLength: 30 }
        college: { type: ["string", "null"], maxLength: 160 }
        course: { type: ["string", "null"], maxLength: 120 }
        branch: { type: ["string", "null"], maxLength: 120 }
        year: { type: ["string", "null"], maxLength: 40 }
        graduationYear: { type: ["integer", "null"], minimum: 1950, maximum: 2200 }
        skills:
          type: array
          items: { type: string, maxLength: 60 }
          maxItems: 20
        programmingLanguages:
          type: array
          items: { type: string, maxLength: 40 }
          maxItems: 20
        interests:
          type: array
          items: { type: string, maxLength: 80 }
          maxItems: 20
        careerGoal: { type: ["string", "null"], maxLength: 120 }
        preferredJobRole: { type: ["string", "null"], maxLength: 120 }
        learningGoals: { type: ["string", "null"], maxLength: 500 }
        skillLevel: { type: ["string", "null"], maxLength: 40 }
        targetCompanies:
          type: array
          items: { type: string, maxLength: 100 }
          maxItems: 10
    Job:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        company: { type: string }
        location: { type: string }
        workType: { type: string }
        experienceRequired: { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        salary: { type: ["string", "null"] }
        description: { type: string }
        qualifications: { type: string }
        applicationDeadline: { type: ["string", "null"] }
        sourceUrl: { type: string }
        updatedAt: { type: string }
      required: [id, title, company, location, workType, experienceRequired, requiredSkills, salary, description, qualifications, applicationDeadline, sourceUrl, updatedAt]
    EngineeringMaterial:
      type: object
      properties:
        id: { type: integer }
        branch: { type: string }
        subject: { type: string }
        title: { type: string }
        materialType: { type: string }
        summary: { type: string }
        topics:
          type: array
          items: { type: string }
      required: [id, branch, subject, title, materialType, summary, topics]
    InterviewRole:
      type: object
      properties:
        role: { type: string }
        questionCount: { type: integer }
        categories:
          type: array
          items: { type: string }
      required: [role, questionCount, categories]
    InterviewQuestion:
      type: object
      properties:
        id: { type: integer }
        role: { type: string }
        category: { type: string }
        prompt: { type: string }
        difficulty: { type: string }
        answerGuide: { type: string }
      required: [id, role, category, prompt, difficulty, answerGuide]
    CodingProblem:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        statement: { type: string }
        difficulty: { type: string }
        topic: { type: string }
        supportedLanguages:
          type: array
          items: { type: string }
        examples: { type: string }
        constraints: { type: string }
        expectedApproach: { type: string }
      required: [id, slug, title, statement, difficulty, topic, supportedLanguages, examples, constraints, expectedApproach]
    CodingSubmissionInput:
      type: object
      properties:
        problemId: { type: integer }
        language: { type: string }
        sourceCode: { type: string, maxLength: 20000 }
      required: [problemId, language, sourceCode]
    CodingSubmissionResult:
      type: object
      properties:
        accepted: { type: boolean }
        status: { type: string }
        message: { type: string }
      required: [accepted, status, message]
    FeedbackInput:
      type: object
      properties:
        category: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        attachmentUrl: { type: ["string", "null"], maxLength: 500 }
      required: [category, subject, description]
    Feedback:
      type: object
      properties:
        id: { type: integer }
        category: { type: string }
        subject: { type: string }
        description: { type: string }
        status: { type: string }
        createdAt: { type: string }
      required: [id, category, subject, description, status, createdAt]

