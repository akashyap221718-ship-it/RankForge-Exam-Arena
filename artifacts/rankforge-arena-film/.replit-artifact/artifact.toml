kind = "video"
previewPath = "/rankforge-arena-film/"
title = "RankForge Exam Arena Film"
description = "A short animated, looping film about the RankForge Exam Arena project."
version = "1.0.0"
id = "artifacts/rankforge-arena-film"
router = "path"

[[services]]
name = "web"
paths = [ "/rankforge-arena-film/" ]
localPort = 24262

[services.development]
run = "pnpm --filter @workspace/rankforge-arena-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rankforge-arena-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/rankforge-arena-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24262"
BASE_PATH = "/rankforge-arena-film/"
videoAspectRatio = "16:9"
